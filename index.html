<!doctype html>
<html lang="uz-Cyrl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Режаларим — вазифалар рўйхати</title>
<meta name="description" content="Календарь, ҳисобот ва йўл харитаси билан оддий вазифалар рўйхати">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6fed'/%3E%3Cpath d='M9 17l5 5 9-11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#2f6fed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>✔ Режаларим</h1>
  <nav class="tabs" role="tablist" aria-label="Бўлимлар">
    <button role="tab" data-tab="tasks">Вазифалар</button>
    <button role="tab" data-tab="calendar">Календарь</button>
    <button role="tab" data-tab="roadmap">Режа</button>
    <button role="tab" data-tab="report">Ҳисобот</button>
  </nav>
</header>

<main id="view" tabindex="-1"></main>

<footer class="foot">
  <span>Маълумот фақат шу қурилмада сақланади.</span>
  <button class="link" data-act="export">Нусха олиш</button>
  <label class="link">Тиклаш<input id="import" type="file" accept="application/json" hidden></label>
</footer>

<dialog id="taskDlg">
  <form id="taskForm" method="dialog">
    <h2 id="taskDlgTitle">Вазифа</h2>
    <label>Номи
      <input name="title" required maxlength="200" autocomplete="off">
    </label>
    <label>Изоҳ
      <textarea name="notes" rows="2" maxlength="1000"></textarea>
    </label>
    <div class="row2">
      <label>Муддат
        <input type="date" name="date">
      </label>
      <label>Тахминий вақт (соат)
        <input type="number" name="est" min="0" max="24" step="0.25" placeholder="масалан, 1.5">
      </label>
    </div>
    <div class="row2">
      <label>Муҳимлиги
        <select name="priority">
          <option value="1">Паст</option>
          <option value="2" selected>Ўрта</option>
          <option value="3">Юқори</option>
        </select>
      </label>
      <label>Тоифа
        <select name="cat"></select>
      </label>
    </div>
    <div class="actions">
      <button type="button" class="danger" id="taskDel">Ўчириш</button>
      <span class="grow"></span>
      <button type="button" id="taskCancel">Бекор қилиш</button>
      <button type="submit" class="primary">Сақлаш</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
